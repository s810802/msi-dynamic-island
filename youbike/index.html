<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouBike 2.0 即時查詢</title>
  <meta name="description" content="隨時查詢台北市各 YouBike 2.0 租借站剩幾台車、還有幾個空位。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=Klee+One:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/youbike.css">
</head>
<body>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <a class="back" href="../">← 回 MSI 首頁</a>
    <h1><span class="logo">🚲</span> YouBike 2.0 即時查詢</h1>
    <div class="times" role="group" aria-label="時間">
      <div class="time-card"><small>現在時間</small><b id="now">--:--:--</b><span id="today"></span></div>
      <div class="time-card data"><small>資料時間</small><b id="dataTime">--</b><span id="ago"></span></div>
    </div>
  </header>

  <main>
    <section class="picker" aria-label="選擇租借站">
      <label>行政區
        <select id="area"></select>
      </label>
      <label>租借站
        <select id="station"></select>
      </label>
      <label class="grow">站名關鍵字
        <input id="kw" type="search" placeholder="例如:市政府、捷運、公園" autocomplete="off">
      </label>
      <button id="refresh" class="refresh" type="button"><span class="spin">↻</span> 立即更新</button>
    </section>
    <p id="status" class="status" role="status">載入中…</p>

    <section id="detail" class="detail" aria-live="polite"></section>

    <section class="summary" id="summary" aria-label="全市概況"></section>

    <h2 class="sec">各行政區概況<small>點一下就切換到該區</small></h2>
    <section class="areas" id="areas"></section>

    <h2 class="sec">所選站點的 Google 地圖</h2>
    <section class="mapbox">
      <div class="map-head"><b id="mapTitle"></b><a id="mapLink" href="#" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a></div>
      <iframe id="map" title="YouBike 租借站 Google 地圖" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </section>
  </main>

  <footer class="foot">資料來源:<a href="https://data.taipei/" target="_blank" rel="noopener">臺北市政府資料大平臺</a>(YouBike 2.0 即時資訊)・資料可能有數分鐘延遲,借還車請以現場為準。</footer>

  <script type="module" src="js/youbike.js?v=1"></script>
  <noscript>此頁需要 JavaScript 才能查詢 YouBike。</noscript>
</body>
</html>
